name: RaqMusic Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleFossDebug -x lint --warning-mode summary
        env:
          PULL_REQUEST: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: RaqMusic-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
